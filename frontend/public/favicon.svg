<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" stroke-width="0" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.35" />
  
  <!-- Stylized Aakash 'A' + E-Commerce Cart Motif -->
  <g filter="url(#glow)">
    <!-- Main A Shape -->
    <path d="M 140 410 L 234 145 C 242 122 270 122 278 145 L 372 410 C 377 424 362 436 348 430 L 308 416 C 300 413 294 406 292 397 L 278 340 L 234 340 L 220 397 C 218 406 212 413 204 416 L 164 430 C 150 436 135 424 140 410 Z" fill="url(#goldGrad)" />
    
    <!-- Crossbar Inner Cut -->
    <path d="M 222 290 L 290 290 L 272 225 C 266 200 246 200 240 225 Z" fill="url(#bgGrad)" />
    
    <!-- Top Crown Diamond (MLM Network Apex) -->
    <polygon points="256,50 274,90 314,108 274,126 256,166 238,126 198,108 238,90" fill="url(#emeraldGrad)" />
  </g>
</svg>